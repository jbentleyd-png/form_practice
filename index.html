<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Change Your Life</title>
    <link rel="icon" type="image/png" href="icons8-100-64.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <img
      src="https://i.pinimg.com/736x/23/69/7b/23697bca327893ec723ba4fc145874f5.jpg"
      alt=""
    />
    <div id="right-side">
      <h1>One hundred days of code isn't for everybody.</h1>
      <h2>Will <em>you</em> make the leap?</h2>

      <form action="">
        <p class="call-to-action">Fill this out, and we'll be in touch.</p>

        <div class="form-row">
          <label for="name">Name:</label>
          <input type="text" id="name" name="name" placeholder="James Dean" />
          <label for="stack">Desired Tech Stack*:</label>
          <select id="stack" name="stack" placeholder="Ruby on Rails" required>
            <option value="Ruby on Rails" selected>Ruby on Rails</option>
            <option value="Node.js">Node.js</option>
            <option value="Django">Django</option>
          </select>
        </div>
        <div class="form-row">
          <label for="years-of-experience">Years of Experience:</label>
          <input
            type="number"
            id="years-of-experience"
            name="years-of-experience"
            placeholder="0"
            min="0"
            max="67"
          />
          <label for="email">Email*:</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="fire_fox_dev@gmail.com"
            required
          />
        </div>
        <div class="form-row password-row">
          <label for="password">Password:</label>
          <input type="password" id="password" name="password" />
          <label for="confirm-password">Confirm Password:</label>
          <input
            type="password"
            id="confirm-password"
            name="confirm-password"
          />
        </div>
      </form>
      <button type="submit" class="submit-button">Submit</button>

      <p>Already have an account? <a href="">Log in</a></p>
    </div>
  </body>
</html>
